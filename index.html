<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学歴史 学習アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .btn { background: #3b82f6; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; text-align: left; margin-bottom: 10px; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-red { background: #ef4444; width: auto; font-size: 0.9rem; padding: 8px 12px; }
    .btn-red:hover { background: #dc2626; }
    .btn-action { background: #10b981; width: auto; font-size: 1rem; text-align: center; margin-top: 10px; }
    .btn-action:hover { background: #059669; }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .hidden { display: none !important; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #f8fafc; margin: 6px 0; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
    #feedback { font-weight: bold; margin: 10px 0; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h1>中学歴史 学習アプリ</h1>

  <!-- 1. 単元選択画面 -->
  <div id="unit-selection" class="card">
    <h2>単元を選ぶ</h2>
    <div id="unit-buttons"></div>
  </div>

  <!-- 2. クイズ画面 -->
  <div id="quiz-screen" class="card hidden">
    <h2 id="quiz-title"></h2>
    <p id="question-text" style="font-size: 1.1rem; font-weight: bold;"></p>
    
    <!-- 選択肢（用語問題用） -->
    <div id="choices-container"></div>

    <!-- 記述入力（説明問題用） -->
    <div id="input-container" class="hidden">
      <input type="text" id="user-answer" placeholder="解答を入力（例：縄、公地公民など）">
      <button class="btn btn-action" onclick="checkTextAnswer()">回答する</button>
    </div>

    <p id="feedback"></p>
    <button id="next-btn" class="btn btn-action hidden" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 3. 学習記録画面 -->
  <div id="logs-screen" class="card">
    <h2>学習記録</h2>
    <ul id="log-list"></ul>
    <div style="margin-top: 15px;">
      <button class="btn btn-red" onclick="clearLogs()">記録をクリア</button>
    </div>
  </div>

  <script>
    // 問題データ
    const quizData = {
      "unit1": {
        title: "1. 歴史のあけぼのと日本列島",
        questions: [
          { type: "choice", q: "旧石器時代に使われていた、石を打ち欠いて作った石器は？", choices: ["打製石器", "磨製石器", "縄文土器"], a: "打製石器" },
          { type: "text", q: "縄文土器の特徴を「縄」という言葉を使って説明しなさい。", keyword: "縄", sample: "表面に縄の目がつけられている点。" }
        ]
      },
      "unit2": {
        title: "2. 古代国家の形成とあゆみ",
        questions: [
          { type: "choice", q: "604年に聖徳太子が制定した、役人の心得を示した法は？", choices: ["大宝律令", "十七条の憲法", "御成敗式目"], a: "十七条の憲法" },
          { type: "text", q: "大化の改新によって土地や民はどう変化したか。「公地公民」を入れて説明しなさい。", keyword: "公地公民", sample: "豪族の私有地・私民を国のものとする公地公民が行われた。" }
        ]
      }
    };

    let currentUnitKey = "";
    let currentQIndex = 0;
    let score = 0;

    // 画面ロード時に実行される処理
    window.addEventListener('DOMContentLoaded', () => {
      renderUnitButtons();
      renderLogs();
    });

    // 単元ボタンの生成
    function renderUnitButtons() {
      const unitBtns = document.getElementById("unit-buttons");
      unitBtns.innerHTML = "";
      for (const key in quizData) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = quizData[key].title;
        btn.onclick = () => startQuiz(key);
        unitBtns.appendChild(btn);
      }
    }

    // クイズ開始
    function startQuiz(unitKey) {
      currentUnitKey = unitKey;
      currentQIndex = 0;
      score = 0;
      document.getElementById("unit-selection").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      showQuestion();
    }

    // 問題表示
    function showQuestion() {
      const unit = quizData[currentUnitKey];
      const q = unit.questions[currentQIndex];
      
      document.getElementById("quiz-title").innerText = `${unit.title} (${currentQIndex + 1}/${unit.questions.length}問)`;
      document.getElementById("question-text").innerText = q.q;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const choicesContainer = document.getElementById("choices-container");
      const inputContainer = document.getElementById("input-container");
      choicesContainer.innerHTML = "";
      document.getElementById("user-answer").value = "";

      if (q.type === "choice") {
        choicesContainer.classList.remove("hidden");
        inputContainer.classList.add("hidden");
        q.choices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = choice;
          btn.onclick = () => checkChoiceAnswer(choice);
          choicesContainer.appendChild(btn);
        });
      } else {
        choicesContainer.classList.add("hidden");
        inputContainer.classList.remove("hidden");
      }
    }

    // 選択肢の正誤判定
    function checkChoiceAnswer(selected) {
      const q = quizData[currentUnitKey].questions[currentQIndex];
      const feedback = document.getElementById("feedback");
      if (selected === q.a) {
        feedback.innerText = "⭕ 正解！";
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解...\n正解は「${q.a}」です。`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 記述式の正誤判定
    function checkTextAnswer() {
      const q = quizData[currentUnitKey].questions[currentQIndex];
      const input = document.getElementById("user-answer").value.trim();
      const feedback = document.getElementById("feedback");

      if (!input) {
        alert("解答を入力してください。");
        return;
      }

      if (input.includes(q.keyword)) {
        feedback.innerText = `⭕ 正解！（キーワード一致）\n【模範解答】${q.sample}`;
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解（キーワード「${q.keyword}」を含めてみましょう）\n【模範解答】${q.sample}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 次の問題へ
    function nextQuestion() {
      currentQIndex++;
      const questions = quizData[currentUnitKey].questions;
      if (currentQIndex < questions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    // 終了と保存
    function finishQuiz() {
      const unitTitle = quizData[currentUnitKey].title;
      const total = quizData[currentUnitKey].questions.length;
      
      saveLog(unitTitle, score, total);

      alert(`単元終了！\nスコア: ${score} / ${total} 問正解`);
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
      renderLogs();
    }

    // 学習ログの保存
    function saveLog(unitTitle, score, total) {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      logs.unshift({
        date: timeStr,
        unit: unitTitle,
        result: `${score}/${total}問正解`
      });

      localStorage.setItem("history_app_logs", JSON.stringify(logs));
    }

    // 学習ログの表示
    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const logList = document.getElementById("log-list");
      logList.innerHTML = "";
      
      if (logs.length === 0) {
        logList.innerHTML = "<li>まだ学習記録はありません。</li>";
        return;
      }

      logs.forEach(log => {
        const li = document.createElement("li");
        li.innerText = `[${log.date}] ${log.unit} ── ${log.result}`;
        logList.appendChild(li);
      });
    }

    // ログクリア
    function clearLogs() {
      if (confirm("学習記録をすべて消去しますか？")) {
        localStorage.removeItem("history_app_logs");
        renderLogs();
      }
    }
  </script>
</body>
</html>
