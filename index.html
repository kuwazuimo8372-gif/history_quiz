<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学歴史 学習アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .chapter-title { font-weight: bold; color: #1e3a8a; background: #e0e7ff; padding: 8px 12px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 0.95rem; }
    
    /* ボタンデザイン */
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; width: 100%; text-align: left; margin-bottom: 6px; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-level { text-align: center; font-weight: bold; padding: 14px; margin-bottom: 10px; font-size: 1rem; }
    .btn-easy { background: #10b981; } .btn-easy:hover { background: #059669; }
    .btn-normal { background: #f59e0b; } .btn-normal:hover { background: #d97706; }
    .btn-hard { background: #ef4444; } .btn-hard:hover { background: #dc2626; }
    .btn-red { background: #ef4444; width: auto; font-size: 0.9rem; padding: 8px 12px; }
    .btn-red:hover { background: #dc2626; }
    .btn-action { background: #10b981; width: auto; font-size: 1rem; text-align: center; margin-top: 10px; }
    .btn-action:hover { background: #059669; }
    .btn-back { background: #6b7280; width: auto; font-size: 0.9rem; margin-bottom: 15px; }
    .btn-back:hover { background: #4b5563; }

    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .hidden { display: none !important; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #f8fafc; margin: 6px 0; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
    #feedback { font-weight: bold; margin: 10px 0; white-space: pre-wrap; line-height: 1.5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; color: white; margin-bottom: 8px; }
    .badge-choice { background: #3b82f6; }
    .badge-text { background: #8b5cf6; }
  </style>
</head>
<body>

  <h1>中学歴史 学習アプリ</h1>

  <!-- 1. 単元選択画面 -->
  <div id="unit-selection" class="card">
    <h2>単元（章・節）を選ぶ</h2>
    <div id="unit-container"></div>
  </div>

  <!-- 2. 難易度選択画面 -->
  <div id="level-selection" class="card hidden">
    <button class="btn btn-back" onclick="backToUnits()">← 単元選び直す</button>
    <h2 id="selected-unit-title"></h2>
    <p>難易度を選択してください（ランダム10問）</p>
    <button class="btn btn-level btn-easy" onclick="startQuiz('easy')">初級（基本用語・2択）</button>
    <button class="btn btn-level btn-normal" onclick="startQuiz('normal')">中級（標準用語・4択）</button>
    <button class="btn btn-level btn-hard" onclick="startQuiz('hard')">上級（簡単な説明・記述問題）</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div id="quiz-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="question-badge" class="badge"></span>
      <span id="quiz-progress" style="font-size: 0.9rem; font-weight: bold; color: #666;"></span>
    </div>
    <p id="question-text" style="font-size: 1.1rem; font-weight: bold; margin-top: 5px;"></p>
    
    <!-- 選択肢（用語問題用） -->
    <div id="choices-container"></div>

    <!-- 記述入力（説明問題用） -->
    <div id="input-container" class="hidden">
      <input type="text" id="user-answer" placeholder="キーワードを含めて説明や用語を入力">
      <button class="btn btn-action" onclick="checkTextAnswer()">回答する</button>
    </div>

    <p id="feedback"></p>
    <button id="next-btn" class="btn btn-action hidden" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 4. 学習記録画面 -->
  <div id="logs-screen" class="card">
    <h2>学習記録</h2>
    <ul id="log-list"></ul>
    <div style="margin-top: 15px;">
      <button class="btn btn-red" onclick="clearLogs()">記録をクリア</button>
    </div>
  </div>

  <script>
    // 教科書目拠の問題データ構造（例として各難易度・問題形式を用意）
    const quizData = [
      {
        chapter: "第1章 歴史のとらえ方と調べ方",
        units: [
          {
            id: "1-1",
            title: "第1節 歴史の流れと時代区分",
            questions: {
              easy: [
                { type: "choice", q: "歴史の時代区分で最も古いのは？", choices: ["古代", "現代"], a: "古代" },
                { type: "choice", q: "現在使われている西暦は何の誕生年を基準にしている？", choices: ["キリスト", "釈迦"], a: "キリスト" },
                { type: "choice", q: "100年を単位とする時代の区分を何というか？", choices: ["世紀", "年代"], a: "世紀" },
                { type: "choice", q: "1世紀は年数で表すと何年間？", choices: ["100年", "10年"], a: "100年" },
                { type: "choice", q: "紀元前を表す略称は？", choices: ["BC", "AD"], a: "BC" },
                { type: "choice", q: "日本で独自に使われている「令和」などの年号を何というか？", choices: ["元号", "西暦"], a: "元号" },
                { type: "choice", q: "古代の次にくる時代区分は？", choices: ["中世", "近世"], a: "中世" },
                { type: "choice", q: "中世の次にくる時代区分は？", choices: ["近世", "近代"], a: "近世" },
                { type: "choice", q: "近世の次にくる時代区分は？", choices: ["近代", "現代"], a: "近代" },
                { type: "choice", q: "旧石器時代や縄文時代はどの時代区分に入る？", choices: ["古代", "中世"], a: "古代" },
                { type: "choice", q: "1901年から2000年までの100年間は何世紀？", choices: ["20世紀", "19世紀"], a: "20世紀" }
              ],
              normal: [
                { type: "choice", q: "15世紀とは何年から何年までを指すか？", choices: ["1401年〜1500年", "1500年〜1599年", "1501年〜1600年", "1400年〜1499年"], a: "1401年〜1500年" },
                { type: "choice", q: "人類が文字を発明して記録を残すようになった時代以降の歴史を何というか？", choices: ["歴史時代", "先史時代", "石器時代", "化石時代"], a: "歴史時代" },
                { type: "choice", q: "文献や史料が残っておらず、発掘された土器や石器から推測する時代を何というか？", choices: ["先史時代", "歴史時代", "古代社会", "近代社会"], a: "先史時代" },
                { type: "choice", q: "日本の時代区分で「武士」が中心となって政治を行った時代が含まれるのは？", choices: ["中世・近世", "古代・中世", "近世・近代", "古代のみ"], a: "中世・近世" },
                { type: "choice", q: "西暦2001年は何世紀にあたるか？", choices: ["21世紀", "20世紀", "19世紀", "22世紀"], a: "21世紀" },
                { type: "choice", q: "紀元前300年と紀元後300年の間は何年離れているか？（0年は存在しない）", choices: ["599年", "600年", "601年", "300年"], a: "599年" },
                { type: "choice", q: "明治維新以降、太平洋戦争の終わり頃までを一般に何時代と区分するか？", choices: ["近代", "近世", "現代", "中世"], a: "近代" },
                { type: "choice", q: "第二次世界大戦以降の現代社会の時代区分は？", choices: ["現代", "近代", "近世", "未来"], a: "現代" },
                { type: "choice", q: "日本の元号で「大正」の次にくる元号は？", choices: ["昭和", "明治", "平成", "令和"], a: "昭和" },
                { type: "choice", q: "歴史を「政治」「経済」「文化」などのテーマ別に学習することを何というか？", choices: ["分野別学習", "時代別学習", "地域別学習", "構造学習"], a: "分野別学習" },
                { type: "choice", q: "西暦前（紀元前）を英語でなんと表記するか？", choices: ["B.C.", "A.D.", "A.M.", "P.M."], a: "B.C." }
              ],
              hard: [
                { type: "text", q: "「世紀」という単位で年数を表す際、西暦101年から200年は何世紀になるか書きなさい。", keyword: "2世紀", sample: "2世紀（または第2世紀）" },
                { type: "text", q: "文字による記録が残される以前の時代を何というか答えなさい。", keyword: "先史", sample: "先史時代" },
                { type: "text", q: "歴史の時代区分において、江戸時代はどの区分（古代・中世・近世・近代）にあたるか答えなさい。", keyword: "近世", sample: "近世" },
                { type: "text", q: "「歴史時代」と「先史時代」の違いを「文字」という言葉を使って説明しなさい。", keyword: "文字", sample: "文字による記録が残されているかどうかの違い。" },
                { type: "text", q: "西暦で「紀元」の基準となっている出来事は何か簡単に説明しなさい。", keyword: "キリスト", sample: "イエス・キリストが生まれたとされる年を基準にしている。" },
                { type: "text", q: "日本の「元号」と世界共通の「西暦」の違いについて簡潔に説明しなさい。", keyword: "日本", sample: "元号は日本独自の年代の数え方であり、西暦は世界共通の基準である点。" },
                { type: "text", q: "「近代」と「現代」の境目となる日本の歴史的出来事は何か答えなさい。", keyword: "太平洋戦争", sample: "太平洋戦争（第二次世界大戦）の終戦" },
                { type: "text", q: "1世紀が「100年間」であることを踏まえ、西暦501〜600年が何世紀か答えなさい。", keyword: "6世紀", sample: "6世紀" },
                { type: "text", q: "歴史を時代順に並べた表のことを何というか答えなさい。", keyword: "年表", sample: "年表" },
                { type: "text", q: "歴史の研究や調査において、当時の状況を知る手がかりとなる文献や遺物の総称を答えなさい。", keyword: "史料", sample: "史料（資料）" },
                { type: "text", q: "「中世」とは一般にどのような勢力が中心となった時代か説明しなさい。", keyword: "武士", sample: "武士が社会や政治の中心となった時代。" }
              ]
            }
          }
        ]
      },
      {
        chapter: "第2章 古代国家の成立と東アジア",
        units: [
          {
            id: "2-3",
            title: "第3節 中国になった国家づくり",
            questions: {
              easy: [
                { type: "choice", q: "聖徳太子が定めた冠位十二階で重視されたものは？", choices: ["家柄にとらわれない才能", "家柄の高さ"], a: "家柄にとらわれない才能" },
                { type: "choice", q: "604年に聖徳太子が制定した役人の心得は？", choices: ["十七条の憲法", "大宝律令"], a: "十七条の憲法" },
                { type: "choice", q: "聖徳太子が小野妹子らを派遣した中国の国は？", choices: ["隋", "唐"], a: "隋" },
                { type: "choice", q: "645年に中大兄皇子らが蘇我氏を倒して始めた政治改革は？", choices: ["大化の改新", "壬申の乱"], a: "大化の改新" },
                { type: "choice", q: "大化の改新で土地と人民を国のものとした制度は？", choices: ["公地公民", "班田収授法"], a: "公地公民" },
                { type: "choice", q: "701年に制定され、律令国家の骨組みとなった法は？", choices: ["大宝律令", "十七条の憲法"], a: "大宝律令" },
                { type: "choice", q: "710年に奈良に作られた都は？", choices: ["平城京", "平安京"], a: "平城京" },
                { type: "choice", q: "戸籍に基づいて人々に土地を与え、死んだら国に返させた制度は？", choices: ["班田収授法", "公地公民"], a: "班田収授法" },
                { type: "choice", q: "聖武天皇が仏教の力で国を守るために建てた奈良の大寺院は？", choices: ["東大寺", "法隆寺"], a: "東大寺" },
                { type: "choice", q: "唐の制度や文化を取り入れるために遣わされた使節は？", choices: ["遣唐使", "遣隋使"], a: "遣唐使" },
                { type: "choice", q: "聖武天皇の遺品などが納められている正倉院の建築様式は？", choices: ["校倉造", "寝殿造"], a: "校倉造" }
              ],
              normal: [
                { type: "choice", q: "聖徳太子が摂政となって支えた天皇は誰か？", choices: ["推古天皇", "持統天皇", "孝徳天皇", "元明天皇"], a: "推古天皇" },
                { type: "choice", q: "大化の改新の中心人物で、のちに天智天皇となった人物は？", choices: ["中大兄皇子", "大海人皇子", "聖徳太子", "藤原不比等"], a: "中大兄皇子" },
                { type: "choice", q: "663年、日本が百済を助けるために戦い、唐・新羅の連合軍に敗れた戦いは？", choices: ["白村江の戦い", "壬申の乱", "湊川の戦い", "壇ノ浦の戦い"], a: "白村江の戦い" },
                { type: "choice", q: "天智天皇の死後、後継者をめぐって起こった古代最大の内乱は？", choices: ["壬申の乱", "乙巳の変", "平将門の乱", "保元の乱"], a: "壬申の乱" },
                { type: "choice", q: "壬申の乱に勝利し、即位して天皇中心の政治を進めた人物は？", choices: ["天武天皇", "天智天皇", "聖武天皇", "桓武天皇"], a: "天武天皇" },
                { type: "choice", q: "律令国家において、地方から送られた特産物の税を何というか？", choices: ["調", "庸", "租", "雑公"], a: "調" },
                { type: "choice", q: "律令国家において、稲の収穫量の約3％を納める税を何というか？", choices: ["租", "調", "庸", "労役"], a: "租" },
                { type: "choice", q: "唐の鑑真が苦難の末に日本に渡り、伝えたものは何か？", choices: ["正しい仏教の戒律", "儒教の教え", "造紙技術", "漢方薬の製法のみ"], a: "正しい仏教の戒律" },
                { type: "choice", q: "奈良時代に作られた、日本最古の和歌集は何か？", choices: ["万葉集", "古今和歌集", "新古今和歌集", "百人一首"], a: "万葉集" },
                { type: "choice", q: "743年、墾田の永久私有を認めた法律は何か？", choices: ["墾田永年私財法", "三世一身の法", "大宝律令", "班田収授法"], a: "墾田永年私財法" },
                { type: "choice", q: "貴族や寺社が所有した私有地のことを何というか？", choices: ["荘園", "公地", "惣村", "寄進地"], a: "荘園" }
              ],
              hard: [
                { type: "text", q: "聖徳太子が定めた「冠位十二階」の目的を、「家柄」という言葉を使って説明しなさい。", keyword: "家柄", sample: "家柄にとらわれず、個人の才能や功績に応じて能力のある人物を登用するため。" },
                { type: "text", q: "大化の改新によって行われた「公地公民」とはどのような制度か説明しなさい。", keyword: "土地", sample: "豪族が私有していた土地や人民を、国の直接支配（公地・公民）とする制度。" },
                { type: "text", q: "聖武天皇が国ごとに国分寺・国分尼寺を建て、大仏を造立した理由を説明しなさい。", keyword: "仏教", sample: "仏教の力によって社会の不安や災害、病気を鎮め、国を守ろうとしたため（鎮護国家）。" },
                { type: "text", q: "「墾田永年私財法」が発行されたことで、律令国家の基本である何という原則が崩れたか答えなさい。", keyword: "公地公民", sample: "公地公民の原則（制度）" },
                { type: "text", q: "正倉院にシルクロード経由の宝物が多数収蔵されている理由を「唐」の都の状況を踏まえて説明しなさい。", keyword: "国際", sample: "唐の都（長安）が国際的な都市であり、遣唐使などを通じて東西の文化が日本に伝わったため。" },
                { type: "text", q: "律令政治のもとで、民衆に課された負担のうち「調」とはどのような税か説明しなさい。", keyword: "特産物", sample: "絹や布、地域の特産品などを国に納める税。" },
                { type: "text", q: "701年に制定された、法律に基づいて国を治める仕組みの基準となった法令を答えなさい。", keyword: "大宝律令", sample: "大宝律令" },
                { type: "text", q: "白村江の戦いで敗れた後、日本（大和政権）が九州沿岸や太宰府周辺に城や防人（さきもり）を配置した目的を説明しなさい。", keyword: "攻め", sample: "唐や新羅が日本へ攻め込んでくるのを防ぐ（防御する）ため。" },
                { type: "text", q: "奈良時代に成立した、日本の神話や歴史を記録した最古の歴史書を1つ答えなさい。", keyword: "古事記", sample: "古事記（または日本書紀）" },
                { type: "text", q: "「班田収授法」において、農民に分け与えられた土地を何というか答えなさい。", keyword: "口分田", sample: "口分田" },
                { type: "text", q: "鑑真が何度も遭難しながらも日本に来航して築いた、僧侶に授ける資格（戒律）を与える場所を何というか答えなさい。", keyword: "戒壇", sample: "戒壇（戒壇堂）" }
              ]
            }
          }
        ]
      }
    ];

    let currentUnit = null;
    let currentLevel = "";
    let quizQuestions = [];
    let currentQIndex = 0;
    let score = 0;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      renderUnitButtons();
      renderLogs();
    });

    // 単元ボタン一覧の描画
    function renderUnitButtons() {
      const container = document.getElementById("unit-container");
      container.innerHTML = "";
      
      quizData.forEach(chap => {
        const chapTitle = document.createElement("div");
        chapTitle.className = "chapter-title";
        chapTitle.innerText = chap.chapter;
        container.appendChild(chapTitle);

        chap.units.forEach(unit => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = unit.title;
          btn.onclick = () => selectUnit(unit);
          container.appendChild(btn);
        });
      });
    }

    // 単元選択 -> 難易度画面へ
    function selectUnit(unit) {
      currentUnit = unit;
      document.getElementById("selected-unit-title").innerText = unit.title;
      document.getElementById("unit-selection").classList.add("hidden");
      document.getElementById("level-selection").classList.remove("hidden");
    }

    function backToUnits() {
      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
    }

    // 配列のシャッフル関数（フィッシャー–イェーツ）
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // クイズの開始（難易度決定＆ランダム10問抽出）
    function startQuiz(level) {
      currentLevel = level;
      const pool = currentUnit.questions[level] || [];

      if (pool.length === 0) {
        alert("この単元・難易度の問題は準備中です。");
        return;
      }

      // 問題プールをシャッフルして最大10問を抽出
      quizQuestions = shuffleArray(pool).slice(0, 10);
      currentQIndex = 0;
      score = 0;

      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      showQuestion();
    }

    // 問題の表示
    function showQuestion() {
      const q = quizQuestions[currentQIndex];
      const badge = document.getElementById("question-badge");
      
      document.getElementById("quiz-progress").innerText = `第 ${currentQIndex + 1} / ${quizQuestions.length} 問`;
      document.getElementById("question-text").innerText = q.q;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const choicesContainer = document.getElementById("choices-container");
      const inputContainer = document.getElementById("input-container");
      choicesContainer.innerHTML = "";
      document.getElementById("user-answer").value = "";

      if (q.type === "choice") {
        badge.innerText = "用語・選択問題";
        badge.className = "badge badge-choice";
        choicesContainer.classList.remove("hidden");
        inputContainer.classList.add("hidden");

        // 選択肢もランダム順にする
        const shuffledChoices = shuffleArray(q.choices);
        shuffledChoices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = choice;
          btn.onclick = () => checkChoiceAnswer(choice);
          choicesContainer.appendChild(btn);
        });
      } else {
        badge.innerText = "説明・記述問題";
        badge.className = "badge badge-text";
        choicesContainer.classList.add("hidden");
        inputContainer.classList.remove("hidden");
      }
    }

    // 選択肢判定
    function checkChoiceAnswer(selected) {
      const q = quizQuestions[currentQIndex];
      const feedback = document.getElementById("feedback");
      
      // ボタン連打防止
      const btns = document.getElementById("choices-container").getElementsByTagName("button");
      for (let btn of btns) btn.disabled = true;

      if (selected === q.a) {
        feedback.innerText = "⭕ 正解！";
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解...\n【正解】${q.a}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 記述式判定（キーワード判定）
    function checkTextAnswer() {
      const q = quizQuestions[currentQIndex];
      const input = document.getElementById("user-answer").value.trim();
      const feedback = document.getElementById("feedback");

      if (!input) {
        alert("解答を入力してください。");
        return;
      }

      if (input.includes(q.keyword)) {
        feedback.innerText = `⭕ 正解！（キーワード一致）\n【模範解答】${q.sample}`;
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解（キーワード「${q.keyword}」を含めてみましょう）\n【模範解答】${q.sample}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    // 次の問題へ
    function nextQuestion() {
      currentQIndex++;
      if (currentQIndex < quizQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    // クイズ終了と学習記録の保存
    function finishQuiz() {
      const levelNames = { easy: "初級", normal: "中級", hard: "上級" };
      const total = quizQuestions.length;
      
      saveLog(currentUnit.title, levelNames[currentLevel], score, total);

      alert(`単元演習が終了しました！\n難易度: ${levelNames[currentLevel]}\nスコア: ${score} / ${total} 問正解`);
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
      renderLogs();
    }

    // 学習ログの保存（ローカルストレージ）
    function saveLog(unitTitle, levelName, score, total) {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      logs.unshift({
        date: timeStr,
        unit: unitTitle,
        level: levelName,
        result: `${score}/${total}問正解`
      });

      localStorage.setItem("history_app_logs", JSON.stringify(logs));
    }

    // 学習ログの描画
    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const logList = document.getElementById("log-list");
      logList.innerHTML = "";
      
      if (logs.length === 0) {
        logList.innerHTML = "<li>まだ学習記録はありません。</li>";
        return;
      }

      logs.forEach(log => {
        const li = document.createElement("li");
        li.innerText = `[${log.date}] ${log.unit} (${log.level}) ── ${log.result}`;
        logList.appendChild(li);
      });
    }

    // ログクリア
    function clearLogs() {
      if (confirm("学習記録をすべて消去しますか？")) {
        localStorage.removeItem("history_app_logs");
        renderLogs();
      }
    }
  </script>
</body>
</html>
