<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社会科 中学生の歴史 学習アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .chapter-title { font-weight: bold; color: #1e3a8a; background: #e0e7ff; padding: 8px 12px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 0.95rem; }
    
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; width: 100%; text-align: left; margin-bottom: 6px; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-level { text-align: center; font-weight: bold; padding: 14px; margin-bottom: 10px; font-size: 1rem; }
    .btn-easy { background: #10b981; } .btn-easy:hover { background: #059669; }
    .btn-normal { background: #f59e0b; } .btn-normal:hover { background: #d97706; }
    .btn-hard { background: #ef4444; } .btn-hard:hover { background: #dc2626; }
    .btn-red { background: #ef4444; width: auto; font-size: 0.9rem; padding: 8px 12px; }
    .btn-red:hover { background: #dc2626; }
    .btn-action { background: #10b981; width: auto; font-size: 1rem; text-align: center; margin-top: 10px; }
    .btn-action:hover { background: #059669; }
    .btn-back { background: #6b7280; width: auto; font-size: 0.9rem; margin-bottom: 15px; }
    .btn-back:hover { background: #4b5563; }

    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .hidden { display: none !important; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #f8fafc; margin: 6px 0; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
    #feedback { font-weight: bold; margin: 10px 0; white-space: pre-wrap; line-height: 1.5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; color: white; margin-bottom: 8px; }
    .badge-choice { background: #3b82f6; }
    .badge-text { background: #8b5cf6; }
  </style>
</head>
<body>

  <h1>社会科 中学生の歴史 日本の歩みと世界の動き</h1>

  <!-- 1. 単元選択画面 -->
  <div id="unit-selection" class="card">
    <h2>単元（章・節）を選ぶ</h2>
    <div id="unit-container"></div>
  </div>

  <!-- 2. 難易度選択画面 -->
  <div id="level-selection" class="card hidden">
    <button class="btn btn-back" onclick="backToUnits()">← 単元を選び直す</button>
    <h2 id="selected-unit-title"></h2>
    <p>難易度を選択してください（全10問がランダム出題されます）</p>
    <button class="btn btn-level btn-easy" onclick="startQuiz('easy')">初級（基本用語・2択）</button>
    <button class="btn btn-level btn-normal" onclick="startQuiz('normal')">中級（標準用語・4択）</button>
    <button class="btn btn-level btn-hard" onclick="startQuiz('hard')">上級（説明・記述問題）</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div id="quiz-screen" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="question-badge" class="badge"></span>
      <span id="quiz-progress" style="font-size: 0.9rem; font-weight: bold; color: #666;"></span>
    </div>
    <p id="question-text" style="font-size: 1.1rem; font-weight: bold; margin-top: 5px;"></p>
    
    <!-- 選択肢（用語問題用） -->
    <div id="choices-container"></div>

    <!-- 記述入力（説明問題用） -->
    <div id="input-container" class="hidden">
      <input type="text" id="user-answer" placeholder="キーワードを含めて説明や用語を入力">
      <button class="btn btn-action" onclick="checkTextAnswer()">回答する</button>
    </div>

    <p id="feedback"></p>
    <button id="next-btn" class="btn btn-action hidden" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 4. 学習記録画面 -->
  <div id="logs-screen" class="card">
    <h2>学習記録</h2>
    <ul id="log-list"></ul>
    <div style="margin-top: 15px;">
      <button class="btn btn-red" onclick="clearLogs()">記録をクリア</button>
    </div>
  </div>

  <script>
    // 教科書目次に準拠した全22節データ構造
    const quizData = [
      {
        chapter: "第1章 歴史のとらえ方と調べ方",
        units: [
          { id: "1-1", title: "第1節 歴史の流れと時代区分" },
          { id: "1-2", title: "第2節 歴史の調べ方・まとめ方・発表のしかた" }
        ]
      },
      {
        chapter: "第2章 古代国家の成立と東アジア",
        units: [
          { id: "2-1", title: "第1節 人類の登場から文明の発生へ" },
          { id: "2-2", title: "第2節 東アジアのなかの倭(日本)" },
          { id: "2-3", title: "第3節 中国になった国家づくり" },
          { id: "2-4", title: "第4節 展開する天皇・貴族の政治" }
        ]
      },
      {
        chapter: "第3章 武家政権の成長と東アジア",
        units: [
          { id: "3-1", title: "第1節 武士の世の始まり" },
          { id: "3-2", title: "第2節 武家政権の内と外" },
          { id: "3-3", title: "第3節 人々の結びつきが強まる社会" }
        ]
      },
      {
        chapter: "第4章 武家政権の展開と世界の動き",
        units: [
          { id: "4-1", title: "第1節 大航海によって結びつく世界" },
          { id: "4-2", title: "第2節 戦乱から全国統一へ" },
          { id: "4-3", title: "第3節 武士による全国支配の完成" },
          { id: "4-4", title: "第4節 天下泰平の世の中" },
          { id: "4-5", title: "第5節 社会の変化と幕府の対策" }
        ]
      },
      {
        chapter: "第5章 近代国家の歩みと国際社会",
        units: [
          { id: "5-1", title: "第1節 欧米諸国における近代化" },
          { id: "5-2", title: "第2節 開国と幕府の終わり" },
          { id: "5-3", title: "第3節 明治政府による近代化の始まり" },
          { id: "5-4", title: "第4節 近代国家への歩み" },
          { id: "5-5", title: "第5節 帝国主義と日本" },
          { id: "5-6", title: "第6節 アジアの強国の光と影" }
        ]
      },
      {
        chapter: "第6章 二度の世界大戦と日本",
        units: [
          { id: "6-1", title: "第1節 第一次世界大戦と民族独立の動き" },
          { id: "6-2", title: "第2節 高まるデモクラシーの意識" },
          { id: "6-3", title: "第3節 戦争に向かう世論" },
          { id: "6-4", title: "第4節 第二次世界大戦の惨禍" }
        ]
      },
      {
        chapter: "第7章 現在に続く日本と世界",
        units: [
          { id: "7-1", title: "第1節 敗戦から立ち直る日本" },
          { id: "7-2", title: "第2節 世界の多極化と日本の成長" },
          { id: "7-3", title: "第3節 これからの日本と世界" }
        ]
      }
    ];

    // 問題データベース（汎用生成＋固定データ）
    function getQuestions(unitId, level) {
      // 特定単元の固定記述・用語問題
      if (unitId === "2-3" && level === "hard") {
        return [
          { type: "text", q: "聖徳太子が定めた「冠位十二階」の目的を「家柄」という言葉を使って説明しなさい。", keyword: "家柄", sample: "家柄にとらわれず個人の能力に応じた人材を登用するため。" },
          { type: "text", q: "大化の改新で行われた「公地公民」とはどんな制度か説明しなさい。", keyword: "土地", sample: "土地や民を豪族の私有物ではなく国の直接支配とする制度。" },
          { type: "text", q: "聖武天皇が大仏を造立した目的を説明しなさい。", keyword: "仏教", sample: "仏教の力で国家の不安や災害を鎮めるため。" },
          { type: "text", q: "701年に制定された、唐の仕組みを手本とした法令を何というか。", keyword: "大宝律令", sample: "大宝律令" },
          { type: "text", q: "墾田永年私財法によって認可された私有地を何というか。", keyword: "荘園", sample: "荘園" },
          { type: "text", q: "710年に奈良に平城京が作られたが、手本とされた唐の都はどこか。", keyword: "長安", sample: "長安" },
          { type: "text", q: "正倉院にシルクロード由来の宝物が納められている理由を簡単に書きなさい。", keyword: "唐", sample: "唐が国際的都市であり遣唐使等を通じて文化が伝わったため。" },
          { type: "text", q: "戸籍に基づき土地を与えて死後に返却させた制度を何というか。", keyword: "班田収授", sample: "班田収授法" },
          { type: "text", q: "鑑真が命懸けで日本に渡り伝えたものは何か。", keyword: "戒律", sample: "正しい仏教の戒律" },
          { type: "text", q: "律令政治で地方の特産物を納める税を何というか。", keyword: "調", sample: "調" },
          { type: "text", q: "日本最古の和歌集の名前を書きなさい。", keyword: "万葉集", sample: "万葉集" }
        ];
      }

      // その他の全単元共通の10問自動生成（初級2択、中級4択、上級記述）
      let list = [];
      for (let i = 1; i <= 12; i++) {
        if (level === "easy") {
          list.push({
            type: "choice",
            q: `【${unitId} 基本問題 ${i}】この単元の重要用語に関する正しい説明を選びなさい。`,
            choices: [`正解の選択肢 A${i}`, `誤りの選択肢 B${i}`],
            a: `正解の選択肢 A${i}`
          });
        } else if (level === "normal") {
          list.push({
            type: "choice",
            q: `【${unitId} 標準問題 ${i}】この単元で発生した出来事や制度として適切なものはどれか。`,
            choices: [`正解の選択肢 A${i}`, `ダミー1`, `ダミー2`, `ダミー3`],
            a: `正解の選択肢 A${i}`
          });
        } else {
          list.push({
            type: "text",
            q: `【${unitId} 記述問題 ${i}】この単元の重要用語や背景についてキーワード「歴史」を含めて簡潔に説明しなさい。`,
            keyword: "歴史",
            sample: `これは ${unitId} の重要な歴史的事象に関する模範解答です。`
          });
        }
      }
      return list;
    }

    let currentUnit = null;
    let currentLevel = "";
    let quizQuestions = [];
    let currentQIndex = 0;
    let score = 0;

    window.addEventListener('DOMContentLoaded', () => {
      renderUnitButtons();
      renderLogs();
    });

    // 章・節の一覧描画
    function renderUnitButtons() {
      const container = document.getElementById("unit-container");
      container.innerHTML = "";
      
      quizData.forEach(chap => {
        const chapTitle = document.createElement("div");
        chapTitle.className = "chapter-title";
        chapTitle.innerText = chap.chapter;
        container.appendChild(chapTitle);

        chap.units.forEach(unit => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = unit.title;
          btn.onclick = () => selectUnit(unit);
          container.appendChild(btn);
        });
      });
    }

    function selectUnit(unit) {
      currentUnit = unit;
      document.getElementById("selected-unit-title").innerText = unit.title;
      document.getElementById("unit-selection").classList.add("hidden");
      document.getElementById("level-selection").classList.remove("hidden");
    }

    function backToUnits() {
      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz(level) {
      currentLevel = level;
      const pool = getQuestions(currentUnit.id, level);

      quizQuestions = shuffleArray(pool).slice(0, 10);
      currentQIndex = 0;
      score = 0;

      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      const q = quizQuestions[currentQIndex];
      const badge = document.getElementById("question-badge");
      
      document.getElementById("quiz-progress").innerText = `第 ${currentQIndex + 1} / ${quizQuestions.length} 問`;
      document.getElementById("question-text").innerText = q.q;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const choicesContainer = document.getElementById("choices-container");
      const inputContainer = document.getElementById("input-container");
      choicesContainer.innerHTML = "";
      document.getElementById("user-answer").value = "";

      if (q.type === "choice") {
        badge.innerText = "用語・選択問題";
        badge.className = "badge badge-choice";
        choicesContainer.classList.remove("hidden");
        inputContainer.classList.add("hidden");

        const shuffledChoices = shuffleArray(q.choices);
        shuffledChoices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = choice;
          btn.onclick = () => checkChoiceAnswer(choice);
          choicesContainer.appendChild(btn);
        });
      } else {
        badge.innerText = "説明・記述問題";
        badge.className = "badge badge-text";
        choicesContainer.classList.add("hidden");
        inputContainer.classList.remove("hidden");
      }
    }

    function checkChoiceAnswer(selected) {
      const q = quizQuestions[currentQIndex];
      const feedback = document.getElementById("feedback");
      
      const btns = document.getElementById("choices-container").getElementsByTagName("button");
      for (let btn of btns) btn.disabled = true;

      if (selected === q.a) {
        feedback.innerText = "⭕ 正解！";
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解...\n【正解】${q.a}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function checkTextAnswer() {
      const q = quizQuestions[currentQIndex];
      const input = document.getElementById("user-answer").value.trim();
      const feedback = document.getElementById("feedback");

      if (!input) {
        alert("解答を入力してください。");
        return;
      }

      if (input.includes(q.keyword)) {
        feedback.innerText = `⭕ 正解！（キーワード一致）\n【模範解答】${q.sample}`;
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解（キーワード「${q.keyword}」を含めてみましょう）\n【模範解答】${q.sample}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQIndex++;
      if (currentQIndex < quizQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const levelNames = { easy: "初級", normal: "中級", hard: "上級" };
      const total = quizQuestions.length;
      
      saveLog(currentUnit.title, levelNames[currentLevel], score, total);

      alert(`演習終了！\n難易度: ${levelNames[currentLevel]}\nスコア: ${score} / ${total} 問正解`);
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
      renderLogs();
    }

    function saveLog(unitTitle, levelName, score, total) {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      logs.unshift({
        date: timeStr,
        unit: unitTitle,
        level: levelName,
        result: `${score}/${total}問正解`
      });

      localStorage.setItem("history_app_logs", JSON.stringify(logs));
    }

    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const logList = document.getElementById("log-list");
      logList.innerHTML = "";
      
      if (logs.length === 0) {
        logList.innerHTML = "<li>まだ学習記録はありません。</li>";
        return;
      }

      logs.forEach(log => {
        const li = document.createElement("li");
        li.innerText = `[${log.date}] ${log.unit} (${log.level}) ── ${log.result}`;
        logList.appendChild(li);
      });
    }

    function clearLogs() {
      if (confirm("学習記録をすべて消去しますか？")) {
        localStorage.removeItem("history_app_logs");
        renderLogs();
      }
    }
  </script>
</body>
</html>
