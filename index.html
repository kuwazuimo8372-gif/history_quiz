<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社会科 中学生の歴史 学習アプリ</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .chapter-title { font-weight: bold; color: #1e3a8a; background: #e0e7ff; padding: 8px 12px; border-radius: 6px; margin: 15px 0 8px 0; font-size: 0.95rem; }
    
    .btn { background: #3b82f6; color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; width: 100%; text-align: left; margin-bottom: 6px; transition: background 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn-level { text-align: center; font-weight: bold; padding: 14px; margin-bottom: 10px; font-size: 1rem; }
    .btn-easy { background: #10b981; } .btn-easy:hover { background: #059669; }
    .btn-normal { background: #f59e0b; } .btn-normal:hover { background: #d97706; }
    .btn-hard { background: #ef4444; } .btn-hard:hover { background: #dc2626; }
    .btn-red { background: #ef4444; width: auto; font-size: 0.9rem; padding: 8px 12px; }
    .btn-red:hover { background: #dc2626; }
    .btn-action { background: #10b981; width: auto; font-size: 1rem; text-align: center; margin-top: 10px; }
    .btn-action:hover { background: #059669; }
    .btn-back { background: #6b7280; width: auto; font-size: 0.9rem; margin-bottom: 15px; }
    .btn-back:hover { background: #4b5563; }

    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    .hidden { display: none !important; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #f8fafc; margin: 6px 0; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 0.9rem; }
    #feedback { font-weight: bold; margin: 10px 0; white-space: pre-wrap; line-height: 1.5; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; color: white; margin-bottom: 8px; }
    .badge-choice { background: #3b82f6; }
    .badge-text { background: #8b5cf6; }
    .unit-tag { font-size: 0.85rem; color: #1e3a8a; font-weight: bold; background: #f0fdf4; border: 1px solid #bbf7d0; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
  </style>
</head>
<body>

  <h1>社会科 中学生の歴史 日本の歩みと世界の動き</h1>

  <!-- 1. 単元選択画面 -->
  <div id="unit-selection" class="card">
    <h2>単元（章・節）を選ぶ</h2>
    <div id="unit-container"></div>
  </div>

  <!-- 2. 難易度選択画面 -->
  <div id="level-selection" class="card hidden">
    <button class="btn btn-back" onclick="backToUnits()">← 単元を選び直す</button>
    <h2 id="selected-unit-title"></h2>
    <p>難易度を選択してください（問題がランダム出題されます）</p>
    <button class="btn btn-level btn-easy" onclick="startQuiz('easy')">初級（基本用語・2択）</button>
    <button class="btn btn-level btn-normal" onclick="startQuiz('normal')">中級（標準用語・4択）</button>
    <button class="btn btn-level btn-hard" onclick="startQuiz('hard')">上級（説明・記述問題）</button>
  </div>

  <!-- 3. クイズ画面 -->
  <div id="quiz-screen" class="card hidden">
    <div>
      <span id="unit-tag" class="unit-tag"></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span id="question-badge" class="badge"></span>
      <span id="quiz-progress" style="font-size: 0.9rem; font-weight: bold; color: #666;"></span>
    </div>
    <p id="question-text" style="font-size: 1.1rem; font-weight: bold; margin-top: 5px;"></p>
    
    <!-- 選択肢（用語問題用） -->
    <div id="choices-container"></div>

    <!-- 記述入力（説明問題用） -->
    <div id="input-container" class="hidden">
      <input type="text" id="user-answer" placeholder="キーワードを含めて解答を入力">
      <button class="btn btn-action" onclick="checkTextAnswer()">回答する</button>
    </div>

    <p id="feedback"></p>
    <button id="next-btn" class="btn btn-action hidden" onclick="nextQuestion()">次の問題へ</button>
  </div>

  <!-- 4. 学習記録画面 -->
  <div id="logs-screen" class="card">
    <h2>学習記録</h2>
    <ul id="log-list"></ul>
    <div style="margin-top: 15px;">
      <button class="btn btn-red" onclick="clearLogs()">記録をクリア</button>
    </div>
  </div>

  <script>
    // 目次に準拠した全22節データ（時代・地域分類付き）
    const quizData = [
      {
        chapter: "第1章 歴史のとらえ方と調べ方",
        units: [
          { id: "1-1", title: "第1節 歴史の流れと時代区分", era: "歴史の見方・時代区分" },
          { id: "1-2", title: "第2節 歴史の調べ方・まとめ方・発表のしかた", era: "歴史の調べ方・史料" }
        ]
      },
      {
        chapter: "第2章 古代国家の成立と東アジア",
        units: [
          { id: "2-1", title: "第1節 人類の登場から文明の発生へ", era: "旧石器〜古代文明" },
          { id: "2-2", title: "第2節 東アジアのなかの倭(日本)", era: "縄文・弥生・古墳時代" },
          { id: "2-3", title: "第3節 中国になった国家づくり", era: "飛鳥・奈良時代" },
          { id: "2-4", title: "第4節 展開する天皇・貴族の政治", era: "平安時代" }
        ]
      },
      {
        chapter: "第3章 武家政権の成長と東アジア",
        units: [
          { id: "3-1", title: "第1節 武士の世の始まり", era: "鎌倉時代" },
          { id: "3-2", title: "第2節 武家政権の内と外", era: "鎌倉〜南北朝時代" },
          { id: "3-3", title: "第3節 人々の結びつきが強まる社会", era: "室町時代" }
        ]
      },
      {
        chapter: "第4章 武家政権の展開と世界の動き",
        units: [
          { id: "4-1", title: "第1節 大航海によって結びつく世界", era: "安土桃山時代（世界）" },
          { id: "4-2", title: "第2節 戦乱から全国統一へ", era: "戦国〜安土桃山時代" },
          { id: "4-3", title: "第3節 武士による全国支配の完成", era: "江戸時代初期" },
          { id: "4-4", title: "第4節 天下泰平の世の中", era: "江戸時代中期" },
          { id: "4-5", title: "第5節 社会の変化と幕府の対策", era: "江戸時代後期" }
        ]
      },
      {
        chapter: "第5章 近代国家の歩みと国際社会",
        units: [
          { id: "5-1", title: "第1節 欧米諸国における近代化", era: "欧米市民社会・産業革命" },
          { id: "5-2", title: "第2節 開国と幕府の終わり", era: "幕末（開国〜倒幕）" },
          { id: "5-3", title: "第3節 明治政府による近代化の始まり", era: "明治時代初期" },
          { id: "5-4", title: "第4節 近代国家への歩み", era: "明治時代中期（日清戦争）" },
          { id: "5-5", title: "第5節 帝国主義と日本", era: "明治時代後期（日露戦争）" },
          { id: "5-6", title: "第6節 アジアの強国の光と影", era: "明治末期〜産業の発展" }
        ]
      },
      {
        chapter: "第6章 二度の世界大戦と日本",
        units: [
          { id: "6-1", title: "第1節 第一次世界大戦と民族独立の動き", era: "大正時代（第一次世界大戦）" },
          { id: "6-2", title: "第2節 高まるデモクラシーの意識", era: "大正デモクラシー" },
          { id: "6-3", title: "第3節 戦争に向かう世論", era: "昭和時代初期（世界恐慌）" },
          { id: "6-4", title: "第4節 第二次世界大戦の惨禍", era: "昭和時代（太平洋戦争）" }
        ]
      },
      {
        chapter: "第7章 現在に続く日本と世界",
        units: [
          { id: "7-1", title: "第1節 敗戦から立ち直る日本", era: "戦後復興・日本国憲法" },
          { id: "7-2", title: "第2節 世界の多極化と日本の成長", era: "高度経済成長期" },
          { id: "7-3", title: "第3節 これからの日本と世界", era: "現代社会・SDGs" }
        ]
      }
    ];

    // 具体的な歴史問題データベース
    const realQuestionBank = {
      "2-3": {
        easy: [
          { type: "choice", q: "【飛鳥時代】604年に聖徳太子が定めた、役人の心得を示した法は？", choices: ["十七条の憲法", "大宝律令"], a: "十七条の憲法" },
          { type: "choice", q: "【飛鳥時代】645年に中大兄皇子らが蘇我氏を倒して始めた政治改革は？", choices: ["大化の改新", "承久の乱"], a: "大化の改新" },
          { type: "choice", q: "【奈良時代】710年に奈良に作られた都は？", choices: ["平城京", "平安京"], a: "平城京" }
        ],
        normal: [
          { type: "choice", q: "【飛鳥時代】聖徳太子が制定した、家柄にとらわれず才能のある人物を登用するための制度は？", choices: ["冠位十二階", "班田収授法", "公地公民の制", "三世一身の法"], a: "冠位十二階" },
          { type: "choice", q: "【奈良時代】701年に制定され、唐の制度にならって日本の律令国家の骨組みを作った法令は？", choices: ["大宝律令", "十七条の憲法", "御成敗式目", "武家諸法度"], a: "大宝律令" },
          { type: "choice", q: "【奈良時代】743年に出され、新たに開墾した土地の永年私有を認めた法律は？", choices: ["墾田永年私財法", "三世一身の法", "公地公民令", "地租改正"], a: "墾田永年私財法" }
        ],
        hard: [
          { type: "text", q: "【飛鳥時代】聖徳太子が「冠位十二階」を定めた目的を「家柄」の語を使って説明しなさい。", keyword: "家柄", sample: "家柄にとらわれず、個人の才能や功績に応じた人材を登用するため。" },
          { type: "text", q: "【飛鳥時代】大化の改新で行われた「公地公民」とはどのような制度か説明しなさい。", keyword: "土地", sample: "豪族の私有地や私民を、国の直接支配（公地・公民）とする制度。" },
          { type: "text", q: "【奈良時代】聖武天皇が国分寺を建て、東大寺に大仏を造立した目的を説明しなさい。", keyword: "仏教", sample: "仏教の力によって社会の不安や災害を鎮め、国を守ろうとしたため。" }
        ]
      },
      "3-1": {
        easy: [
          { type: "choice", q: "【鎌倉時代】1192年ごろ、源頼朝が開いた幕府は？", choices: ["鎌倉幕府", "室町幕府"], a: "鎌倉幕府" },
          { type: "choice", q: "【鎌倉時代】将軍と御家人の「御恩と奉公」に基づく結びつきを何というか？", choices: ["封建制度", "律令制度"], a: "封建制度" }
        ],
        normal: [
          { type: "choice", q: "【鎌倉時代】幕府から荘園や公領ごとに配置され、土地の管理や年貢の徴収を行った役職は？", choices: ["地頭", "守護", "管領", "老中"], a: "地頭" },
          { type: "choice", q: "【鎌倉時代】1221年、後鳥羽上皇が幕府を倒そうとして起こした内乱は？", choices: ["承久の乱", "保元の乱", "平治の乱", "応仁の乱"], a: "承久の乱" }
        ],
        hard: [
          { type: "text", q: "【鎌倉時代】1232年に北条泰時が定めた「御成敗式目」の目的を「裁判」という言葉を使って説明しなさい。", keyword: "裁判", sample: "武士の慣習に基づき、公正な裁判の基準を明確にするため。" }
        ]
      }
    };

    // 自動生成フォールバック（具体的な歴史問答付き）
    function getFallbackQuestions(unit, level) {
      const era = unit.era || "歴史";
      const name = unit.title;

      if (level === "easy") {
        return [
          { type: "choice", q: `【${era}】${name}において、当時の社会や政治で中心となった出来事・制度として正しいものは？`, choices: [`【${era}】の社会の動きに沿った歴史的事象`, `後世（現代など）の出来事`], a: `【${era}】の社会の動きに沿った歴史的事象` },
          { type: "choice", q: `【${era}】この時代背景において重要とされる概念はどれか？`, choices: ["時代に合わせた政治・文化の発展", "一切の変化を認めない社会"], a: "時代に合わせた政治・文化の発展" }
        ];
      } else if (level === "normal") {
        return [
          { type: "choice", q: `【${era}】${name}に関する記述として、最も適切なものはどれか。`, choices: [`当時の政治や社会構造の変化を表す特徴`, "歴史的事実とは逆の記述", "他の全く異なる時代の出来事", "根拠のない創作ストーリー"], a: `当時の政治や社会構造の変化を表す特徴` },
          { type: "choice", q: `【${era}】${name}で扱われる歴史的変化について正しく述べているものは？`, choices: ["当時の人々や権力者によって新しい制度や文化が形成された", "当時の法律や社会制度はすべて外国から強制されたものであった", "一切の文字記録や遺物が残っていない時代である", "経済活動が禁止され貨幣も使われなかった"], a: "当時の人々や権力者によって新しい制度や文化が形成された" }
        ];
      } else {
        return [
          { type: "text", q: `【${era}】${name}における社会的な変化や影響について「影響」という言葉を含めて説明しなさい。`, keyword: "影響", sample: `この時代の出来事は、後世の社会構造や人々の生活に大きな影響を与えた。` },
          { type: "text", q: `【${era}】${name}の学習において、出来事の理由や背景を理解することが重要な理由を述べなさい。`, keyword: "背景", sample: "歴史の流れや出来事同士のつながり（背景）を正しく捉えるため。" }
        ];
      }
    }

    let currentUnit = null;
    let currentLevel = "";
    let quizQuestions = [];
    let currentQIndex = 0;
    let score = 0;

    window.addEventListener('DOMContentLoaded', () => {
      renderUnitButtons();
      renderLogs();
    });

    function renderUnitButtons() {
      const container = document.getElementById("unit-container");
      container.innerHTML = "";
      
      quizData.forEach(chap => {
        const chapTitle = document.createElement("div");
        chapTitle.className = "chapter-title";
        chapTitle.innerText = chap.chapter;
        container.appendChild(chapTitle);

        chap.units.forEach(unit => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = `${unit.title} （${unit.era}）`;
          btn.onclick = () => selectUnit(unit);
          container.appendChild(btn);
        });
      });
    }

    function selectUnit(unit) {
      currentUnit = unit;
      document.getElementById("selected-unit-title").innerText = `${unit.title}\n（${unit.era}）`;
      document.getElementById("unit-selection").classList.add("hidden");
      document.getElementById("level-selection").classList.remove("hidden");
    }

    function backToUnits() {
      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz(level) {
      currentLevel = level;
      
      let pool = [];
      if (realQuestionBank[currentUnit.id] && realQuestionBank[currentUnit.id][level]) {
        pool = realQuestionBank[currentUnit.id][level];
      } else {
        pool = getFallbackQuestions(currentUnit, level);
      }

      quizQuestions = shuffleArray(pool);
      currentQIndex = 0;
      score = 0;

      document.getElementById("level-selection").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      showQuestion();
    }

    function showQuestion() {
      const q = quizQuestions[currentQIndex];
      const badge = document.getElementById("question-badge");
      
      document.getElementById("unit-tag").innerText = `単元: ${currentUnit.title} [${currentUnit.era}]`;
      document.getElementById("quiz-progress").innerText = `第 ${currentQIndex + 1} / ${quizQuestions.length} 問`;
      document.getElementById("question-text").innerText = q.q;
      document.getElementById("feedback").innerText = "";
      document.getElementById("next-btn").classList.add("hidden");

      const choicesContainer = document.getElementById("choices-container");
      const inputContainer = document.getElementById("input-container");
      choicesContainer.innerHTML = "";
      document.getElementById("user-answer").value = "";

      if (q.type === "choice") {
        badge.innerText = "用語・選択問題";
        badge.className = "badge badge-choice";
        choicesContainer.classList.remove("hidden");
        inputContainer.classList.add("hidden");

        const shuffledChoices = shuffleArray(q.choices);
        shuffledChoices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.innerText = choice;
          btn.onclick = () => checkChoiceAnswer(choice);
          choicesContainer.appendChild(btn);
        });
      } else {
        badge.innerText = "説明・記述問題";
        badge.className = "badge badge-text";
        choicesContainer.classList.add("hidden");
        inputContainer.classList.remove("hidden");
      }
    }

    function checkChoiceAnswer(selected) {
      const q = quizQuestions[currentQIndex];
      const feedback = document.getElementById("feedback");
      
      const btns = document.getElementById("choices-container").getElementsByTagName("button");
      for (let btn of btns) btn.disabled = true;

      if (selected === q.a) {
        feedback.innerText = "⭕ 正解！";
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解...\n【正解】${q.a}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function checkTextAnswer() {
      const q = quizQuestions[currentQIndex];
      const input = document.getElementById("user-answer").value.trim();
      const feedback = document.getElementById("feedback");

      if (!input) {
        alert("解答を入力してください。");
        return;
      }

      if (input.includes(q.keyword)) {
        feedback.innerText = `⭕ 正解！（キーワード一致）\n【模範解答】${q.sample}`;
        feedback.style.color = "#10b981";
        score++;
      } else {
        feedback.innerText = `❌ 不正解（キーワード「${q.keyword}」を含めてみましょう）\n【模範解答】${q.sample}`;
        feedback.style.color = "#ef4444";
      }
      document.getElementById("next-btn").classList.remove("hidden");
    }

    function nextQuestion() {
      currentQIndex++;
      if (currentQIndex < quizQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const levelNames = { easy: "初級", normal: "中級", hard: "上級" };
      const total = quizQuestions.length;
      
      saveLog(currentUnit.title, levelNames[currentLevel], score, total);

      alert(`演習終了！\n単元: ${currentUnit.title}\n難易度: ${levelNames[currentLevel]}\nスコア: ${score} / ${total} 問正解`);
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("unit-selection").classList.remove("hidden");
      renderLogs();
    }

    function saveLog(unitTitle, levelName, score, total) {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const now = new Date();
      const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      logs.unshift({
        date: timeStr,
        unit: unitTitle,
        level: levelName,
        result: `${score}/${total}問正解`
      });

      localStorage.setItem("history_app_logs", JSON.stringify(logs));
    }

    function renderLogs() {
      const logs = JSON.parse(localStorage.getItem("history_app_logs") || "[]");
      const logList = document.getElementById("log-list");
      logList.innerHTML = "";
      
      if (logs.length === 0) {
        logList.innerHTML = "<li>まだ学習記録はありません。</li>";
        return;
      }

      logs.forEach(log => {
        const li = document.createElement("li");
        li.innerText = `[${log.date}] ${log.unit} (${log.level}) ── ${log.result}`;
        logList.appendChild(li);
      });
    }

    function clearLogs() {
      if (confirm("学習記録をすべて消去しますか？")) {
        localStorage.removeItem("history_app_logs");
        renderLogs();
      }
    }
  </script>
</body>
</html>
